```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloud Event Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 85% 15%, #294d80 0%, transparent 38%),
                linear-gradient(135deg, #111a38, #202b59 55%, #17395c);
            color: #f8fafc;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .topbar {
            padding: 22px 7%;
            border-bottom: 1px solid rgba(255,255,255,.12);
        }

        .brand {
            color: white;
            font-size: 1.1rem;
            font-weight: 750;
            text-decoration: none;
        }

        .brand span {
            color: #71d9f5;
        }

        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 26px;
            background: rgba(255,255,255,.09);
            box-shadow: 0 24px 65px rgba(0,0,0,.22);
            backdrop-filter: blur(16px);
        }

        .brand-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            margin-bottom: 25px;
            border-radius: 18px;
            background: linear-gradient(135deg, #7878f5, #54d5ec);
            color: #101a3b;
            font-size: 27px;
        }

        .eyebrow {
            margin-bottom: 8px;
            color: #75d9f4;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.7px;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #c2cce4;
            line-height: 1.7;
        }

        .form-label {
            margin-bottom: 9px;
            color: #f1f5ff;
            font-weight: 600;
        }

        .form-control {
            min-height: 50px;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px;
            background: rgba(10,20,48,.35);
            color: white;
        }

        .form-control::placeholder {
            color: #aebbd5;
        }

        .form-control:focus {
            border-color: #76d9f3;
            background: rgba(10,20,48,.55);
            color: white;
            box-shadow: 0 0 0 3px rgba(118,217,243,.15);
        }

        .login-btn {
            min-height: 51px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(100deg, #7777f5, #54d5ec);
            color: #111a38;
            font-size: 1rem;
            font-weight: 750;
            transition: transform .2s, filter .2s;
        }

        .login-btn:hover {
            color: #111a38;
            filter: brightness(1.08);
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #a9dcff;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
            text-decoration: underline;
        }

        footer {
            padding: 18px;
            border-top: 1px solid rgba(255,255,255,.1);
            color: #aebbd5;
            font-size: .88rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <a href="index.html" class="brand">
            Cloud Event <span>Management</span>
        </a>
    </header>

    <main class="login-area">
        <section class="login-card">
            <div class="brand-icon" aria-hidden="true">✦</div>

            <p class="eyebrow">Welcome back</p>
            <h1 id="loginHeading">Login to your portal</h1>
            <p class="subtitle">
                Access your events, registrations, and attendance in one place.
            </p>

            <form id="loginForm">
                <div class="mb-4">
                    <label for="email" class="form-label">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="you@example.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn login-btn w-100">
                    Login <span aria-hidden="true">→</span>
                </button>
            </form>

            <div class="text-center">
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
        </section>
    </main>

    <footer>
        Cloud Event Management System · Campus events, made simpler
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
```
