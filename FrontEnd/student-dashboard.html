<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

<style>
/* ===== Modern Student Dashboard Theme ===== */
:root {
    --navy: #172554;
    --indigo: #4f46e5;
    --page-bg: #f1f5fb;
    --text-main: #1e293b;
    --muted: #64748b;
}

body {
    background: var(--page-bg);
    color: var(--text-main);
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
}

.navbar {
    background: linear-gradient(110deg, var(--navy), #312e81) !important;
    padding: 16px 0;
    box-shadow: 0 4px 18px rgba(23, 37, 84, .18);
}

.navbar-brand { font-weight: 750; letter-spacing: .2px; }

.navbar .btn {
    border: 0;
    border-radius: 10px;
    font-weight: 600;
    padding: 9px 18px;
}

h2 { color: var(--navy); font-weight: 800; }
.text-muted { color: var(--muted) !important; }

#events-container {
    margin-top: 24px;
    row-gap: 24px;
}

#events-container > [class*="col-"] { display: flex; }

#events-container .card {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    overflow: hidden;
    background: white;
    box-shadow: 0 6px 22px rgba(30, 41, 59, .06);
    transition: transform .2s ease, box-shadow .2s ease;
}

#events-container .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 30px rgba(30, 41, 59, .12);
}

#events-container .card-header {
    background: linear-gradient(110deg, #eef2ff, #dbeafe);
    color: var(--navy);
    border-bottom: 1px solid #dbeafe;
    padding: 16px 20px;
    font-weight: 700;
}

#events-container .card-body { padding: 22px; }

#events-container .card-title {
    color: var(--navy);
    font-size: 1.2rem;
    font-weight: 750;
    margin-bottom: 12px;
}

#events-container .card-text { color: #475569; line-height: 1.65; }

.btn-primary {
    background: var(--indigo);
    border-color: var(--indigo);
    border-radius: 10px;
    font-weight: 650;
    padding: 10px 16px;
}

.btn-primary:hover {
    background: #3730a3;
    border-color: #3730a3;
    transform: translateY(-1px);
}

.modal-content {
    border: 0;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(15, 23, 42, .22);
}

.modal-header {
    background: linear-gradient(110deg, var(--navy), #312e81);
    color: white;
    padding: 20px 24px;
    border-bottom: 0;
}

.modal-header .modal-title { color: white; font-weight: 750; }
.modal-header .btn-close { filter: invert(1); }
.modal-body { padding: 24px; }

.form-control, .form-select {
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 12px;
}

.form-control:focus, .form-select:focus {
    border-color: #818cf8;
    box-shadow: 0 0 0 .2rem rgba(79, 70, 229, .13);
}

.form-label { color: #334155; font-weight: 650; }

.modal-footer {
    border-top: 1px solid #e2e8f0;
    padding: 16px 24px;
}

@media (max-width: 768px) {
    .container { padding-left: 18px; padding-right: 18px; }
    #events-container .card { border-radius: 14px; }
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Cloud Event Management
        </span>

        <a href="index.html"
           class="btn btn-light">
            Logout
        </a>

    </div>

</nav>


<div class="container mt-4">

    <h2>Student Dashboard</h2>

    <p class="text-muted">
        Browse and register for upcoming events.
    </p>

    <div id="events-container" class="row">

        <div class="text-center">
            Loading events...
        </div>

    </div>

</div>


<!-- Registration Modal -->

<div class="modal fade"
     id="registrationModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Event Registration
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <p>
                    Register for:
                    <strong id="selected-event"></strong>
                </p>


                <form id="registration-form">

                    <input
                        type="hidden"
                        id="event-id">


                    <div class="mb-3">

                        <label class="form-label">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="student-id"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="student-name"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="student-email"
                            class="form-control"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark">

                        Submit Registration

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    // ==========================================
    // LOAD EVENTS
    // ==========================================

    async function loadEvents() {

        const container =
            document.getElementById("events-container");


        try {

            const response =
                await fetch(
                    "https://cloud-event-api.orangepebble-4049d871.centralindia.azurecontainerapps.io/events"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load events"
                );

            }


            const events =
                await response.json();


            container.innerHTML = "";


            events.forEach(function(event) {

                const card =
                    document.createElement("div");

                card.className =
                    "col-md-6 col-lg-4 mb-4";


                card.innerHTML = `

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h4 class="card-title">
                                ${event.title}
                            </h4>

                            <p>
                                ${event.description}
                            </p>

                            <p>
                                <strong>Date:</strong>
                                ${event.date}
                            </p>

                            <p>
                                <strong>Time:</strong>
                                ${event.time}
                            </p>

                            <p>
                                <strong>Venue:</strong>
                                ${event.venue}
                            </p>

                            <p>
                                <strong>Capacity:</strong>
                                ${event.capacity}
                            </p>

                            <button
                                class="btn btn-dark register-button">

                                Register

                            </button>

                        </div>

                    </div>

                `;


                // Get the Register button

                const registerButton =
                    card.querySelector(
                        ".register-button"
                    );


                // Attach click event

                registerButton.addEventListener(
                    "click",
                    function() {

                        openRegistration(
                            event.id,
                            event.title
                        );

                    }
                );


                container.appendChild(card);

            });

        }


        catch (error) {

            console.error(
                "Error loading events:",
                error
            );


            container.innerHTML = `

                <div class="alert alert-danger">

                    Unable to connect to backend.

                </div>

            `;

        }

    }


    // ==========================================
    // OPEN REGISTRATION MODAL
    // ==========================================

    function openRegistration(
        eventId,
        eventTitle
    ) {

        console.log(
            "Register clicked:",
            eventId,
            eventTitle
        );


        document.getElementById(
            "event-id"
        ).value = eventId;


        document.getElementById(
            "selected-event"
        ).textContent = eventTitle;


        const modalElement =
            document.getElementById(
                "registrationModal"
            );


        const modal =
            new bootstrap.Modal(
                modalElement
            );


        modal.show();

    }


    // ==========================================
    // SUBMIT REGISTRATION
    // ==========================================

    document
        .getElementById("registration-form")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const registrationData = {

                    eventId:
                        document.getElementById(
                            "event-id"
                        ).value,

                    studentId:
                        document.getElementById(
                            "student-id"
                        ).value,

                    studentName:
                        document.getElementById(
                            "student-name"
                        ).value,

                    studentEmail:
                        document.getElementById(
                            "student-email"
                        ).value

                };


                console.log(
                    "Sending registration:",
                    registrationData
                );


                try {

                    const response =
                        await fetch(
                            "https://cloud-event-api.orangepebble-4049d871.centralindia.azurecontainerapps.io/registrations",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        registrationData
                                    )

                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "Backend response:",
                        result
                    );


                    if (response.ok) {

                        alert(
                            "Registration successful!"
                        );


                        document
                            .getElementById(
                                "registration-form"
                            )
                            .reset();


                        const modalElement =
                            document.getElementById(
                                "registrationModal"
                            );


                        const modal =
                            bootstrap.Modal
                                .getInstance(
                                    modalElement
                                );


                        if (modal) {

                            modal.hide();

                        }

                    }

                    else {

                        alert(
                            "Registration failed: "
                            + result.message
                        );

                    }

                }


                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    alert(
                        "Could not connect to backend."
                    );

                }

            }
        );


    // ==========================================
    // START
    // ==========================================

    loadEvents();

</script>

</body>

</html>
