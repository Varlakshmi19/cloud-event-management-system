<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Cloud Event Management
        </span>

        <a href="index.html"
           class="btn btn-light">
            Logout
        </a>

    </div>

</nav>


<div class="container mt-4">

    <h2>Student Dashboard</h2>

    <p class="text-muted">
        Browse and register for upcoming events.
    </p>

    <div id="events-container" class="row">

        <div class="text-center">
            Loading events...
        </div>

    </div>

</div>


<!-- Registration Modal -->

<div class="modal fade"
     id="registrationModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Event Registration
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <p>
                    Register for:
                    <strong id="selected-event"></strong>
                </p>


                <form id="registration-form">

                    <input
                        type="hidden"
                        id="event-id">


                    <div class="mb-3">

                        <label class="form-label">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="student-id"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="student-name"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="student-email"
                            class="form-control"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark">

                        Submit Registration

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    // ==========================================
    // LOAD EVENTS
    // ==========================================

    async function loadEvents() {

        const container =
            document.getElementById("events-container");


        try {

            const response =
                await fetch(
                    "https://cloud-event-api.orangepebble-4049d871.centralindia.azurecontainerapps.io/events"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load events"
                );

            }


            const events =
                await response.json();


            container.innerHTML = "";


            events.forEach(function(event) {

                const card =
                    document.createElement("div");

                card.className =
                    "col-md-6 col-lg-4 mb-4";


                card.innerHTML = `

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h4 class="card-title">
                                ${event.title}
                            </h4>

                            <p>
                                ${event.description}
                            </p>

                            <p>
                                <strong>Date:</strong>
                                ${event.date}
                            </p>

                            <p>
                                <strong>Time:</strong>
                                ${event.time}
                            </p>

                            <p>
                                <strong>Venue:</strong>
                                ${event.venue}
                            </p>

                            <p>
                                <strong>Capacity:</strong>
                                ${event.capacity}
                            </p>

                            <button
                                class="btn btn-dark register-button">

                                Register

                            </button>

                        </div>

                    </div>

                `;


                // Get the Register button

                const registerButton =
                    card.querySelector(
                        ".register-button"
                    );


                // Attach click event

                registerButton.addEventListener(
                    "click",
                    function() {

                        openRegistration(
                            event.id,
                            event.title
                        );

                    }
                );


                container.appendChild(card);

            });

        }


        catch (error) {

            console.error(
                "Error loading events:",
                error
            );


            container.innerHTML = `

                <div class="alert alert-danger">

                    Unable to connect to backend.

                </div>

            `;

        }

    }


    // ==========================================
    // OPEN REGISTRATION MODAL
    // ==========================================

    function openRegistration(
        eventId,
        eventTitle
    ) {

        console.log(
            "Register clicked:",
            eventId,
            eventTitle
        );


        document.getElementById(
            "event-id"
        ).value = eventId;


        document.getElementById(
            "selected-event"
        ).textContent = eventTitle;


        const modalElement =
            document.getElementById(
                "registrationModal"
            );


        const modal =
            new bootstrap.Modal(
                modalElement
            );


        modal.show();

    }


    // ==========================================
    // SUBMIT REGISTRATION
    // ==========================================

    document
        .getElementById("registration-form")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const registrationData = {

                    eventId:
                        document.getElementById(
                            "event-id"
                        ).value,

                    studentId:
                        document.getElementById(
                            "student-id"
                        ).value,

                    studentName:
                        document.getElementById(
                            "student-name"
                        ).value,

                    studentEmail:
                        document.getElementById(
                            "student-email"
                        ).value

                };


                console.log(
                    "Sending registration:",
                    registrationData
                );


                try {

                    const response =
                        await fetch(
                            "https://cloud-event-api.orangepebble-4049d871.centralindia.azurecontainerapps.io/registrations",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        registrationData
                                    )

                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "Backend response:",
                        result
                    );


                    if (response.ok) {

                        alert(
                            "Registration successful!"
                        );


                        document
                            .getElementById(
                                "registration-form"
                            )
                            .reset();


                        const modalElement =
                            document.getElementById(
                                "registrationModal"
                            );


                        const modal =
                            bootstrap.Modal
                                .getInstance(
                                    modalElement
                                );


                        if (modal) {

                            modal.hide();

                        }

                    }

                    else {

                        alert(
                            "Registration failed: "
                            + result.message
                        );

                    }

                }


                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    alert(
                        "Could not connect to backend."
                    );

                }

            }
        );


    // ==========================================
    // START
    // ==========================================

    loadEvents();

</script>

</body>

</html>
